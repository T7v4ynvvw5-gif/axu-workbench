<style>
:root{
  --blue:#F3A7B8; --blue-d:#E08A9F; --blue-l:#FCE3E8; --blue-ll:#FFF5F7;
  --white:#FFFFFF; --ink:#3A3A3A; --ink-s:#666; --ink-ss:#999;
  --line:#F3E0E4; --shadow:0 4px 18px rgba(243,167,184,.22);
  --shadow-lg:0 10px 32px rgba(243,167,184,.3);
  --radius:20px; --radius-s:14px; --radius-xs:10px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,var(--blue-ll),#fff 200px);color:var(--ink);
  font-size:15px;line-height:1.5;overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;border:none;outline:none;background:none}
textarea{resize:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--blue);border-radius:3px;opacity:.5}
::-webkit-scrollbar-track{background:transparent}

/* ===== 布局 ===== */
.app{display:flex;height:100vh;height:100dvh;padding-top:var(--safe-t)}
.sidebar{
  width:264px;flex-shrink:0;background:var(--white);border-right:1px solid var(--line);
  display:flex;flex-direction:column;height:100%;transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:40;
}
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}

/* ===== 顶栏 ===== */
.topbar{
  display:flex;align-items:center;gap:10px;padding:14px 20px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
}
.topbar .menu-btn{display:none;width:38px;height:38px;border-radius:12px;align-items:center;justify-content:center;color:var(--ink)}
.topbar .menu-btn:active{background:var(--blue-l)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:.3px}
.brand .logo{width:42px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--blue-d));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.5px;box-shadow:0 3px 8px rgba(243,167,184,.4)}
.spacer{flex:1}
.status-pill{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:30px;font-size:12.5px;font-weight:600;background:var(--blue-ll);color:var(--ink-s);border:1px solid var(--line)}
.status-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-ss);flex-shrink:0}
.status-pill.cloud{background:var(--blue-l);color:var(--blue-d)}
.status-pill.cloud .dot{background:var(--blue);box-shadow:0 0 0 4px rgba(243,167,184,.25);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(243,167,184,.25)}50%{box-shadow:0 0 0 7px rgba(243,167,184,.08)}}
.icon-btn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink-s);transition:.15s}
.icon-btn:active{background:var(--blue-l);color:var(--blue-d)}

/* ===== 侧边栏 ===== */
.side-head{padding:18px 20px 10px;display:flex;align-items:center;justify-content:space-between}
.side-head .title{font-size:12.5px;font-weight:700;color:var(--ink-ss);letter-spacing:1px}
.side-head .add-cat{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--blue);transition:.15s}
.side-head .add-cat:active{background:var(--blue-l)}
.cat-list{flex:1;overflow-y:auto;padding:6px 12px 16px}
.cat-group{margin-bottom:3px}
.cat-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-s);cursor:pointer;transition:.15s;color:var(--ink-s);font-weight:500;font-size:14.5px;user-select:none}
.cat-item:active{background:var(--blue-ll)}
.cat-item.active{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;box-shadow:0 4px 12px rgba(243,167,184,.35)}
.cat-item.active .cat-ico{color:#fff}
.cat-item.active .cat-count{background:rgba(255,255,255,.25);color:#fff}
.cat-ico{width:20px;height:20px;flex-shrink:0;color:var(--blue);display:flex;align-items:center;justify-content:center}
.cat-item.active .cat-ico{color:#fff}
.cat-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-count{font-size:11px;background:var(--blue-l);color:var(--blue-d);padding:2px 7px;border-radius:10px;font-weight:600;min-width:20px;text-align:center}
.cat-edit{display:none;width:22px;height:22px;border-radius:7px;align-items:center;justify-content:center;color:var(--ink-ss);opacity:.7}
.cat-item:hover .cat-edit{display:flex}
.cat-edit:active{background:var(--blue-l)}
.sub-list{margin:2px 0 6px 14px;padding-left:10px;border-left:1.5px dashed var(--line)}
.sub-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-xs);cursor:pointer;font-size:13.5px;color:var(--ink-s);transition:.15s}
.sub-item:active{background:var(--blue-ll)}
.sub-item.active{color:var(--blue-d);font-weight:600}
.sub-item .dot-s{width:6px;height:6px;border-radius:50%;background:var(--ink-ss);flex-shrink:0}
.sub-item.active .dot-s{background:var(--blue)}
.sub-item .sub-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-item .sub-edit{display:none;opacity:.6}
.sub-item:hover .sub-edit{display:block}
.side-foot{padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);font-size:12px;color:var(--ink-ss);display:flex;align-items:center;gap:8px}
.side-foot .sync-ico{animation:spin 1s linear infinite}
.side-foot.syncing .sync-ico{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 主内容 ===== */
.content{flex:1;overflow-y:auto;padding:20px 24px calc(24px + var(--safe-b));-webkit-overflow-scrolling:touch}
.date-bar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.date-bar h2{font-size:21px;font-weight:700;letter-spacing:.2px}
.date-bar .date-sub{font-size:12.5px;color:var(--ink-ss);font-weight:500}
.date-nav{display:flex;align-items:center;gap:6px;margin-left:auto;background:var(--white);border-radius:30px;padding:4px;box-shadow:var(--shadow)}
.date-nav button{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-s);transition:.15s}
.date-nav button:active{background:var(--blue-l);color:var(--blue-d)}
.date-nav .today{padding:0 14px;height:34px;border-radius:30px;font-size:12.5px;font-weight:600;color:var(--blue-d)}
.date-nav .today:active{background:var(--blue-l)}
.date-picker{width:38px;height:34px;border-radius:30px;display:flex;align-items:center;justify-content:center;color:var(--ink-s);position:relative;overflow:hidden}
.date-picker input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* 卡片 */
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;transition:.2s}
.card.tap{transform:scale(.99)}
.section-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink-ss);letter-spacing:.6px;margin-bottom:14px;text-transform:uppercase}
.section-title .line{flex:1;height:1px;background:var(--line)}

/* 任务条目 */
.task{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--blue);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:.2s;cursor:pointer}
.check.done{background:var(--blue);border-color:var(--blue)}
.check svg{opacity:0;transform:scale(.5);transition:.2s;color:#fff}
.check.done svg{opacity:1;transform:scale(1)}
.task-body{flex:1;min-width:0}
.task-title-input{font-size:15px;font-weight:600;color:var(--ink);width:100%;padding:2px 0}
.task-title-input.done{text-decoration:line-through;color:var(--ink-ss)}
.task-meta{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:var(--ink-ss)}
.task-del{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-ss);opacity:0;transition:.15s;flex-shrink:0}
.task:hover .task-del{opacity:.6}
.task-del:active{opacity:1;background:#fee;color:#e88}

/* 复盘位 */
.review-box{margin-top:10px;background:var(--blue-ll);border-radius:var(--radius-s);padding:10px 12px;display:flex;align-items:flex-start;gap:8px}
.review-box .r-ico{width:16px;height:16px;color:var(--blue-d);flex-shrink:0;margin-top:3px}
.review-box textarea{flex:1;font-size:13px;color:var(--ink);line-height:1.5;min-height:22px;background:transparent}
.review-box textarea::placeholder{color:var(--ink-ss);opacity:.7}

/* 添加任务按钮 */
.add-task{display:flex;align-items:center;gap:8px;padding:11px;color:var(--blue-d);font-weight:600;font-size:14px;border-radius:var(--radius-s);transition:.15s;width:100%}
.add-task:active{background:var(--blue-ll)}

/* 运动打卡项 */
.sport-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.sport-chip{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 8px;border-radius:var(--radius-s);background:var(--blue-ll);cursor:pointer;transition:.15s;border:1.5px solid transparent}
.sport-chip:active{transform:scale(.97)}
.sport-chip.done{background:var(--blue-l);border-color:var(--blue)}
.sport-chip .s-ico{width:24px;height:24px;color:var(--blue-d)}
.sport-chip .s-name{font-size:12.5px;font-weight:600;color:var(--ink)}
.sport-chip .s-val{font-size:11px;color:var(--ink-ss)}
.sport-chip.done .s-val{color:var(--blue-d);font-weight:600}
.sport-add{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;padding:12px 8px;border-radius:var(--radius-s);border:1.5px dashed var(--blue);color:var(--blue-d);font-size:12.5px;font-weight:600;cursor:pointer}

/* 历史折叠 */
.history-section{margin-top:24px}
.hist-group{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.hist-head{display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer;user-select:none}
.hist-head .chev{width:18px;height:18px;color:var(--ink-ss);transition:.25s;flex-shrink:0}
.hist-group.open .hist-head .chev{transform:rotate(90deg)}
.hist-head .h-date{font-weight:700;font-size:14.5px}
.hist-head .h-range{font-size:12px;color:var(--ink-ss);font-weight:500}
.hist-head .h-stat{margin-left:auto;font-size:12px;color:var(--blue-d);font-weight:600;background:var(--blue-l);padding:3px 10px;border-radius:12px}
.hist-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.hist-group.open .hist-body{max-height:3000px}
.hist-inner{padding:0 18px 14px;border-top:1px solid var(--line)}
.hist-day{padding:10px 0;border-bottom:1px dashed var(--line)}
.hist-day:last-child{border-bottom:none}
.hist-day-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0}
.hist-day-head .d{font-size:12.5px;font-weight:600;color:var(--ink-s)}
.hist-day-head .s{font-size:11.5px;color:var(--ink-ss)}
.hist-task{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-s);padding:3px 0}
.hist-task .mini-check{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--blue);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.hist-task.done .mini-check{background:var(--blue);border-color:var(--blue)}
.hist-task.done .mini-check svg{color:#fff}
.hist-task .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-task.done .t{text-decoration:line-through;color:var(--ink-ss)}
.hist-review{font-size:12px;color:var(--ink-s);background:var(--blue-ll);border-radius:8px;padding:5px 9px;margin:3px 0 3px 22px}
.hist-review::before{content:"复盘：";color:var(--blue-d);font-weight:600}

/* 抖音热点 */
.hot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:14px}
.hot-card{background:var(--white);border-radius:var(--radius-s);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.2s}
.hot-card:active{transform:scale(.98)}
.hot-card .h-img{width:100%;aspect-ratio:16/9;background:var(--blue-l);object-fit:cover}
.hot-card .h-body{padding:11px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.hot-card .h-title{font-size:13.5px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.hot-card .h-hot{display:flex;align-items:center;gap:5px;font-size:11.5px;color:#e07856;font-weight:600}
.hot-card .h-jump{display:flex;align-items:center;justify-content:center;gap:5px;padding:7px;border-radius:var(--radius-xs);background:var(--blue-l);color:var(--blue-d);font-size:12px;font-weight:600;transition:.15s;text-decoration:none}
.hot-card .h-jump:active{background:var(--blue)}
.hot-load{display:flex;align-items:center;justify-content:center;gap:10px;padding:30px;color:var(--ink-ss);font-size:13px}
.hot-load .spin{width:18px;height:18px;border:2px solid var(--blue-l);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
.hot-err{padding:24px;text-align:center;color:var(--ink-ss);font-size:13px}
.hot-err button{color:var(--blue-d);font-weight:600;text-decoration:underline;margin-top:8px}

/* 灵感 */
.inspire-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.inspire-item{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;background:var(--blue-ll);border-radius:var(--radius-s);font-size:13px}
.inspire-item .i-ico{color:var(--blue-d);flex-shrink:0;margin-top:1px}
.inspire-item .i-text{flex:1}
.inspire-item .i-del{opacity:.4;width:18px;height:18px;flex-shrink:0}
.inspire-item .i-del:active{opacity:1;color:#e88}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(44,62,80,.35);backdrop-filter:blur(3px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-mask.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--white);border-radius:var(--radius);width:100%;max-width:400px;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:up .25s cubic-bezier(.4,0,.2,1)}
@keyframes up{from{transform:translateY(20px);opacity:.6}}
.modal-head{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--white);border-radius:var(--radius) var(--radius) 0 0}
.modal-head h3{font-size:17px;font-weight:700}
.modal-body{padding:18px 20px}
.modal-foot{padding:14px 20px calc(14px + var(--safe-b));display:flex;gap:10px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--white)}
.btn{flex:1;padding:12px;border-radius:var(--radius-s);font-weight:600;font-size:14.5px;transition:.15s}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;box-shadow:0 4px 12px rgba(243,167,184,.35)}
.btn-primary:active{transform:scale(.98)}
.btn-ghost{background:var(--blue-l);color:var(--blue-d)}
.btn-ghost:active{background:var(--blue-ll)}
.btn-danger{background:#fde8e8;color:#e88}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-s);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:var(--radius-s);background:var(--blue-ll);transition:.15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);background:var(--white)}
.field .hint{font-size:11.5px;color:var(--ink-ss);margin-top:5px}
.row{display:flex;gap:10px}
.row .field{flex:1}
.color-pick{display:flex;gap:8px;flex-wrap:wrap}
.color-pick span{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:.15s}
.color-pick span.sel{border-color:var(--ink)}

/* Toast */
.toast{position:fixed;bottom:calc(24px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(20px);background:rgba(44,62,80,.92);color:#fff;padding:11px 20px;border-radius:30px;font-size:13px;font-weight:500;z-index:200;opacity:0;pointer-events:none;transition:.25s;max-width:80%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 空状态 */
.empty{text-align:center;padding:50px 20px;color:var(--ink-ss)}
.empty .e-ico{width:56px;height:56px;margin:0 auto 14px;color:var(--blue-l)}
.empty .e-t{font-size:14px;font-weight:600;color:var(--ink-s);margin-bottom:4px}
.empty .e-s{font-size:12.5px}

/* 遮罩（移动端侧边栏） */
.scrim{position:fixed;inset:0;background:rgba(44,62,80,.3);z-index:35;display:none}
.scrim.show{display:block}

/* 移动端 */
@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .topbar .menu-btn{display:flex}
  .content{padding:16px 14px calc(20px + var(--safe-b))}
  .topbar{padding:12px 14px}
  .brand{font-size:15.5px}
  .status-pill{font-size:11.5px;padding:6px 11px}
  .date-bar h2{font-size:18px}
  .date-bar{gap:8px}
  .date-nav{margin-left:0;width:100%;justify-content:center}
  .hot-grid{grid-template-columns:1fr 1fr;gap:10px}
  .sport-grid{grid-template-columns:1fr 1fr 1fr}
}
@media (max-width:480px){
  .hot-grid{grid-template-columns:1fr}
  .sport-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

    <div class="content" id="content"></div>

</div>

const $ = (s)=>document.querySelector(s);
const todayStr = ()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const uuid = ()=> 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c=='x'?r:(r&0x3|0x8)).toString(16);});
const debounce = (fn, ms)=>{ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; };
function fmtDate(d){ const dt=new Date(d); return `${dt.getMonth()+1}月${dt.getDate()}日`; }
function fmtWeek(d){ const dt=new Date(d); const onejan=new Date(dt.getFullYear(),0,1); const week=Math.ceil((((dt-onejan)/86400000)+onejan.getDay()+1)/7); return `${dt.getFullYear()}年 第${week}周`; }
function fmtMonth(d){ const dt=new Date(d); return `${dt.getFullYear()}年${dt.getMonth()+1}月`; }
function relDate(d){ const today=todayStr(); if(d===today) return '今天'; const yest=new Date(); yest.setDate(yest.getDate()-1); const ys=`${yest.getFullYear()}-${String(yest.getMonth()+1).padStart(2,'0')}-${String(yest.getDate()).padStart(2,'0')}`; if(d===ys) return '昨天'; return fmtDate(d); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }

/* IndexedDB 任务数据 */
const DB = {
  db: null,
  async open(){
    if(this.db) return this.db;
    return new Promise((res,rej)=>{
      const r = indexedDB.open('workbench_db', 1);
      r.onupgradeneeded = (e)=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains('tasks')){
          const s = db.createObjectStore('tasks', {keyPath:'id'});
          s.createIndex('date','date',{unique:false});
          s.createIndex('categoryId','categoryId',{unique:false});
        }
        if(!db.objectStoreNames.contains('daily')){
          db.createObjectStore('daily', {keyPath:'key'}); // key: date_categoryId
        }
      };
      r.onsuccess = (e)=>{ this.db = e.target.result; res(this.db); };
      r.onerror = (e)=>rej(e);
    });
  },
  async tx(store, mode){
    const db = await this.open();
    return db.transaction(store, mode).objectStore(store);
  },
  async getTasks(date, categoryId){
    const s = await this.tx('tasks','readonly');
    return new Promise((res)=>{
      const idx = s.index('date');
      const result = [];
      idx.openCursor(IDBKeyRange.only(date)).onsuccess = (e)=>{
        const c = e.target.result;
        if(c){ if(c.value.categoryId===categoryId || !categoryId) result.push(c.value); c.continue(); }
        else res(result);
      };
    });
  },
  async putTask(task){
    const s = await this.tx('tasks','readwrite');
    return new Promise((res,rej)=>{ const r=s.put(task); r.onsuccess=()=>res(); r.onerror=rej; });
  },
  async delTask(id){
    const s = await this.tx('tasks','readwrite');
    return new Promise((res,rej)=>{ const r=s.delete(id); r.onsuccess=()=>res(); r.onerror=rej; });
  },
  async allTasks(){
    const s = await this.tx('tasks','readonly');
    return new Promise((res)=>{ const r=s.getAll(); r.onsuccess=()=>res(r.result||[]); });
  },
  async getDaily(key){
    const s = await this.tx('daily','readonly');
    return new Promise((res)=>{ const r=s.get(key); r.onsuccess=()=>res(r.result); });
  },
  async putDaily(obj){
    const s = await this.tx('daily','readwrite');
    return new Promise((res,rej)=>{ const r=s.put(obj); r.onsuccess=()=>res(); r.onerror=rej; });
  },
  async allDaily(){
    const s = await this.tx('daily','readonly');
    return new Promise((res)=>{ const r=s.getAll(); r.onsuccess=()=>res(r.result||[]); });
  }
};

/* ==================== 应用 ==================== */
const App = {

  saveTimers: {},

    $('#settingsBtn').innerHTML = ico('settings',21);

    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    }
  },

  /* ---- 侧边栏 ---- */
  renderSidebar(){
    const list = $('#catList');
    list.innerHTML = '';
    Store.cfg.categories.forEach((cat)=>{
      const g = document.createElement('div');
      g.className = 'cat-group';
      // 顶层分类
      const item = document.createElement('div');
      item.className = 'cat-item' + (this.currentCat && this.currentCat.id===cat.id ? ' active':'');
      const cnt = cat.children ? cat.children.length : 0;
      item.innerHTML = `
        <span class="cat-ico">${ico(CAT_ICONS[cat.icon]||'list',20)}</span>
        <span class="cat-label">${this.esc(cat.name)}</span>
        ${cnt?`<span class="cat-count">${cnt}</span>`:''}
        <span class="cat-edit" data-edit="${cat.id}">${ico('edit3',14)}</span>`;
      item.onclick = (e)=>{ if(e.target.closest('[data-edit]')) return; this.selectCat(cat); if(window.innerWidth<=860) this.toggleSidebar(false); };
      item.querySelector('[data-edit]').onclick = (e)=>{ e.stopPropagation(); this.openCatModal(cat); };
      g.appendChild(item);
      // 子项
      if(cat.children && cat.children.length){
        const sub = document.createElement('div');
        sub.className = 'sub-list';
        cat.children.forEach(ch=>{
          const si = document.createElement('div');
          si.className = 'sub-item' + (this.currentCat && this.currentCat.id===ch.id ? ' active':'');
          si.innerHTML = `<span class="dot-s"></span><span class="sub-label">${this.esc(ch.name)}</span><span class="sub-edit">${ico('edit3',12)}</span>`;
          si.onclick = (e)=>{ if(e.target.closest('.sub-edit')){ e.stopPropagation(); this.openSubModal(cat, ch); return; } this.selectCat({...ch, parent:cat}); if(window.innerWidth<=860) this.toggleSidebar(false); };
          si.querySelector('.sub-edit').onclick = (e)=>{ e.stopPropagation(); this.openSubModal(cat, ch); };
          sub.appendChild(si);
        });
        g.appendChild(sub);
      }
      list.appendChild(g);
    });

  selectCat(cat){
    this.currentCat = cat;
    this.renderSidebar();
    this.renderMain();
  },

  /* ---- 主内容区 ---- */
  async renderMain(){
    const cat = this.currentCat;
    const c = $('#content');
    if(!cat){ c.innerHTML=''; return; }

    // 头部日期栏
    const dt = new Date(this.currentDate);
    const weekday = '日一二三四五六'[dt.getDay()];
    let html = `
      <div class="date-bar">
        <div><h2>${relDate(this.currentDate)}</h2><div class="date-sub">${this.currentDate} 星期${weekday}</div></div>

          <button onclick="App.shiftDate(-1)" title="前一天" style="transform:scaleX(-1)">${ico('chevronRight',16)}</button>

        </div>
      </div>`;

      html += await this.renderSelfmedia();
    } else if(cat.type === 'parenting'){
      html += await this.renderParenting();
    } else if(cat.type === 'sport'){
      html += await this.renderSport();
    } else if(cat.type === 'lang'){
      html += await this.renderLang();
    } else {
      html += await this.renderTask();

    this.bindMainEvents();

  /* ---- 通用任务列表（每日计划/自定义分类）---- */
  async renderTask(){
    const cat = this.currentCat;
    const tasks = await DB.getTasks(this.currentDate, cat.id);
    tasks.sort((a,b)=> (a.order||0)-(b.order||0));
    let html = `<div class="card">
      <div class="section-title">${ico('flag',14)}<span>${this.esc(cat.name)}</span><span class="line"></span></div>`;

    } else {
      tasks.forEach(t=>{
        html += `<div class="task" data-id="${t.id}">
          <div class="check ${t.status==='done'?'done':''}" onclick="App.toggleTask('${t.id}')">${ico('check',14)}</div>
          <div class="task-body">
            <input class="task-title-input ${t.status==='done'?'done':''}" value="${this.esc(t.title)}" placeholder="任务内容..." data-task-title="${t.id}">

    const cat = this.currentCat;

    const daily = (await DB.getDaily(dailyKey)) || { key:dailyKey, date:this.currentDate, categoryId:cat.id, records:{} };

      html += `<div class="sport-chip ${done?'done':''}" onclick="App.toggleSport('${ch.id}')">
        <span class="s-ico">${ico(this.sportIcon(ch.name),24)}</span>

  async loadHot(){
    const wrap = $('#hotWrap');
    if(!wrap) return;
    const apis = [
      { url:'https://60s.viki.moe/v2/douyin', parse:(d)=>{
        if(!d||!d.data) return [];
        return (d.data||[]).map(it=>({ title:it.title||it.name, hot:it.hot_value||it.hot, cover:it.cover||it.imageUrl, url:it.link||it.url }));
      }},
      { url:'https://api-hot.imsyy.top/douyin', parse:(d)=>{
        if(!d||!d.data) return [];
        return (d.data||[]).map(it=>({ title:it.title, hot:it.hot, cover:it.cover, url:it.mobileUrl||it.url }));
      }}
    ];
    for(const api of apis){
      try{
        const resp = await fetch(api.url, {timeout:8000});
        if(!resp.ok) continue;
        const json = await resp.json();
        const list = api.parse(json);
        if(list && list.length){ this.renderHot(list); return; }
      }catch(e){ continue; }
    }
    wrap.innerHTML = `<div class="hot-err">热点获取失败，可能网络受限。<br><button onclick="App.loadHot()">重试</button></div>`;
  },

  renderHot(list){
    const wrap = $('#hotWrap');
    if(!list.length){ wrap.innerHTML = '<div class="hot-err">暂无热点数据</div>'; return; }
    wrap.innerHTML = `<div class="hot-grid">` + list.slice(0,20).map((it,i)=>{
      const hot = it.hot ? (it.hot>10000? (it.hot/10000).toFixed(1)+'万' : it.hot) : '';
      const cover = it.cover ? `<img class="h-img" src="${this.esc(it.cover)}" onerror="this.style.display='none'" loading="lazy">` : `<div class="h-img" style="display:flex;align-items:center;justify-content:center;color:var(--blue)">${ico('video',28)}</div>`;
      return `<div class="hot-card">
        ${cover}
        <div class="h-body">
          <div class="h-title">${i+1}. ${this.esc(it.title)}</div>
          ${hot?`<div class="h-hot">${ico('flame',12)} ${hot}</div>`:''}
          ${it.url?`<a class="h-jump" href="${this.esc(it.url)}" target="_blank" rel="noopener">${ico('external',12)} 一键跳转原平台</a>`:''}
        </div>
      </div>`;
    }).join('') + `</div>`;
  },

  /* ---- 历史折叠 ---- */
  async renderHistory(){
    const cat = this.currentCat;
    const all = await DB.allTasks();
    const allDaily = await DB.allDaily();
    // 收集该分类(及其子分类)的所有任务，按日期分组
    const catIds = new Set();
    if(cat.type==='lang' && cat.parent){ catIds = new Set((cat.parent.children||[]).map(c=>c.id)); }
    else if(cat.children){ catIds.add(cat.id); cat.children.forEach(c=>catIds.add(c.id)); }
    else { catIds.add(cat.id); }
    // 自媒体也含复盘 daily
    const dailyReviews = {};
    allDaily.forEach(d=>{
      if(d.key && d.key.endsWith('_review')){
        const parts = d.key.split('_');
        const date = parts[0]; const cid = parts[1];
        if(catIds.has(cid) || cid===cat.id){ dailyReviews[date] = dailyReviews[date]||[]; dailyReviews[date].push(d); }
      }
    });

    const byDate = {};
    all.forEach(t=>{
      if(catIds.has(t.categoryId)){ byDate[t.date] = byDate[t.date]||[]; byDate[t.date].push(t); }
    });
    // 加运动打卡历史
    if(cat.type==='sport'){
      allDaily.forEach(d=>{
        if(d.key && d.key.endsWith(`_${cat.id}`) && !d.key.endsWith('_review')){
          byDate[d.date] = byDate[d.date]||[];
          // 把运动记录合成展示
          const recs = Object.entries(d.records||{}).filter(([k,v])=>v.done).map(([k,v])=>({id:k,title:(cat.children.find(c=>c.id===k)||{}).name||'运动',status:'done',date:d.date,categoryId:cat.id,value:v.value}));
          byDate[d.date].push(...recs);
        }
      });
    }

    const dates = Object.keys(byDate).filter(d=>d!==this.currentDate).sort().reverse();
    if(!dates.length) return '';

    // 按周分组
    const groups = {};
    dates.forEach(d=>{
      const wk = fmtWeek(d);
      groups[wk] = groups[wk]||[]; groups[wk].push(d);
    });

    let html = `<div class="history-section"><div class="section-title">${ico('calendar',14)}<span>历史记录</span><span class="line"></span></div>`;
    Object.entries(groups).forEach(([wk, ds], gi)=>{
      let total=0, done=0;
      ds.forEach(d=>{ byDate[d].forEach(t=>{ total++; if(t.status==='done')done++; }); });
      html += `<div class="hist-group ${gi===0?'open':''}">
        <div class="hist-head" onclick="this.parentElement.classList.toggle('open')">
          <span class="chev">${ico('chevronRight',18)}</span>
          <span class="h-date">${wk}</span>
          <span class="h-range">${relDate(ds[0])}${ds.length>1?' ~ '+relDate(ds[ds.length-1]):''}</span>
          <span class="h-stat">${done}/${total}</span>
        </div>
        <div class="hist-body"><div class="hist-inner">`;
      ds.forEach(d=>{
        const ts = byDate[d];
        let dDone = ts.filter(t=>t.status==='done').length;
        html += `<div class="hist-day">
          <div class="hist-day-head"><span class="d">${relDate(d)} · ${d}</span><span class="s">${dDone}/${ts.length} 完成</span></div>`;
        ts.forEach(t=>{
          html += `<div class="hist-task ${t.status==='done'?'done':''}">
            <span class="mini-check">${ico('check',10)}</span>
            <span class="t">${this.esc(t.title||'(空)')}</span>
          </div>`;
          if(t.review){ html += `<div class="hist-review">${this.esc(t.review)}</div>`; }
        });
        html += `</div>`;
      });
      html += `</div></div></div>`;
    });
    html += `</div>`;
    return html;
  },

  /* ---- 任务操作 ---- */
  async addTask(categoryId){
    const cid = categoryId || this.currentCat.id;
    const tasks = await DB.getTasks(this.currentDate, cid);
    const t = { id:uuid(), date:this.currentDate, categoryId:cid, title:'', review:'', status:'todo', order:tasks.length, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    await DB.putTask(t);
    this.renderMain();
    // 聚焦新输入框
    setTimeout(()=>{ const inp = document.querySelector(`[data-task-title="${t.id}"]`); if(inp) inp.focus(); },50);
  },

  async toggleTask(id){
    const tasks = await DB.getTasks(this.currentDate);
    const t = tasks.find(x=>x.id===id);
    if(!t) return;
    t.status = t.status==='done' ? 'todo' : 'done';
    t.updatedAt = new Date().toISOString();
    await DB.putTask(t);
    this.renderMain();
  },

    await DB.delTask(id);
    this.renderMain();

  /* ---- 运动操作 ---- */
  async toggleSport(childId){
    const cat = this.currentCat;
    const dailyKey = `${this.currentDate}_${cat.id}`;
    const daily = (await DB.getDaily(dailyKey)) || { key:dailyKey, date:this.currentDate, categoryId:cat.id, records:{} };
    const rec = daily.records[childId] || {done:false, value:''};
    rec.done = !rec.done;

    daily.records[childId] = rec;
    await DB.putDaily(daily);
    this.renderMain();

  /* ---- 灵感 ---- */
  async delInspire(id){

  /* ---- 自动保存绑定 ---- */
  bindMainEvents(){
    const c = $('#content');
    // 任务标题
    c.querySelectorAll('[data-task-title]').forEach(inp=>{
      const id = inp.getAttribute('data-task-title');
      const deb = debounce(async (val)=>{
        const tasks = await DB.allTasks();
        const t = tasks.find(x=>x.id===id);
        if(t){ t.title = val; t.updatedAt = new Date().toISOString(); await DB.putTask(t); this.flashSync(); }
      }, 500);
      inp.addEventListener('input', e=>deb(e.target.value));
    });
    // 任务复盘
    c.querySelectorAll('[data-task-review]').forEach(ta=>{
      const id = ta.getAttribute('data-task-review');
      const deb = debounce(async (val)=>{
        const tasks = await DB.allTasks();
        const t = tasks.find(x=>x.id===id);
        if(t){ t.review = val; t.updatedAt = new Date().toISOString(); await DB.putTask(t); this.flashSync(); }
      }, 500);
      ta.addEventListener('input', e=>deb(e.target.value));
    });
    // 运动复盘
    const sr = c.querySelector('[data-sport-review]');
    if(sr){
      const deb = debounce(async (val)=>{
        const cat = this.currentCat;
        const key = `${this.currentDate}_${cat.id}_review`;
        const d = (await DB.getDaily(key)) || { key, review:'' };
        d.review = val; await DB.putDaily(d); this.flashSync();
      }, 500);
      sr.addEventListener('input', e=>deb(e.target.value));
    }
    // 灵感今日
    const it = c.querySelector('[data-inspire-today]');
    if(it){
      const deb = debounce(async (val)=>{
        const cat = this.currentCat;
        const key = `${this.currentDate}_${cat.id}_inspire`;
        const d = (await DB.getDaily(key)) || { key, text:'' };
        d.text = val; await DB.putDaily(d);
        // 若有内容且不在列表，加入收藏
        const exists = (Store.cfg.inspire||[]).find(i=>i.date===this.currentDate && i.text===val && !i.deleted);
        if(val.trim() && !exists){
          Store.cfg.inspire = Store.cfg.inspire||[];
          // 替换同日同text
          Store.cfg.inspire.push({id:uuid(), text:val, date:this.currentDate, deleted:false});
          Store.save();
        }
        this.flashSync();
      }, 800);
      it.addEventListener('input', e=>deb(e.target.value));
    }
    // 育儿板块：睡前故事自动保存
    const storyEls = ['#storyTitle','#storyContent','#storyReaction'];
    storyEls.forEach(sel=>{
      const el = c.querySelector(sel);
      if(el){
        const deb = debounce(()=>this.saveStory(), 500);
        el.addEventListener('input', ()=>deb());
      }
    });
    // 加载抖音热点
    if(this.currentCat.type==='selfmedia'){ this.loadHot(); }
  },

  flashSync(){
    const f = $('#sideFoot');
    $('#syncText').textContent = '正在保存...';
    clearTimeout(this._syncT);
    this._syncT = setTimeout(()=>{ $('#syncText').textContent = '数据已保存到本地'; }, 800);
  },

  /* ---- 日期导航 ---- */
  shiftDate(n){
    const d = new Date(this.currentDate);
    d.setDate(d.getDate()+n);
    this.setDate(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
  },
  goToday(){ this.setDate(todayStr()); },
  setDate(d){ this.currentDate = d; this.renderMain(); },

  /* ---- 侧边栏开关 ---- */
  toggleSidebar(force){
    const sb = $('#sidebar'), sc = $('#scrim');
    const open = force!==undefined ? force : !sb.classList.contains('open');
    sb.classList.toggle('open', open);
    sc.classList.toggle('show', open);
  },

  /* ---- 状态标识 ---- */
  updateStatus(){
    const s = Store.cfg.settings;
    const pill = $('#statusPill'), txt = $('#statusText');
    if(s.cloudConnected){
      pill.classList.add('cloud');
      pill.querySelector('.dot').style.background = 'var(--blue)';
      txt.textContent = '云端已连接';
    } else {
      pill.classList.remove('cloud');
      txt.textContent = '本地模式';
    }
  },

  /* ---- 分类弹窗 ---- */
  openCatModal(cat){
    const isEdit = !!cat;
    const data = cat || { id:uuid(), name:'', icon:'custom', type:'task', children:[] };
    const types = [
      {v:'task', l:'普通任务（每日计划等）'},
      {v:'parenting', l:'育儿日常（睡前故事+育儿锦囊）'},
      {v:'sport', l:'运动打卡'},
      {v:'lang', l:'语言学习（含复盘位）'},
      {v:'selfmedia', l:'自媒体'}
    ];
    this.showModal(`
      <div class="modal-head"><h3>${isEdit?'编辑分类':'新增分类'}</h3><button class="icon-btn" onclick="App.closeModal()">${ico('x',20)}</button></div>
      <div class="modal-body">
        <div class="field"><label>分类名称</label><input id="cmName" value="${this.esc(data.name)}" placeholder="如：阅读打卡"></div>
        <div class="field"><label>分类类型</label>
          <select id="cmType">
            ${types.map(t=>`<option value="${t.v}" ${data.type===t.v?'selected':''}>${t.l}</option>`).join('')}
          </select>
          <div class="hint">语言学习/自媒体类型会自动带复盘位与特色功能</div>
        </div>
        ${data.type==='lang'?`<div class="field"><label>语言</label><select id="cmLang">
          <option value="en" ${data.lang==='en'?'selected':''}>英语 🇬🇧</option>
          <option value="es" ${data.lang==='es'?'selected':''}>西语 🇪🇸</option>
        </select></div>`:''}
      </div>
      <div class="modal-foot">
        ${isEdit?`<button class="btn btn-danger" onclick="App.delCat('${data.id}')">删除</button>`:''}
        <button class="btn btn-ghost" onclick="App.closeModal()">取消</button>
        <button class="btn btn-primary" onclick="App.saveCat('${data.id}', ${isEdit})">保存</button>
      </div>
    `);
    setTimeout(()=>$('#cmName').focus(),100);
  },

  saveCat(id, isEdit){
    const name = $('#cmName').value.trim();
    if(!name){ toast('请输入名称'); return; }
    const type = $('#cmType').value;
    const langEl = $('#cmLang');
    if(isEdit){
      const c = Store.cfg.categories.find(x=>x.id===id);
      c.name = name; c.type = type;
      if(langEl) c.lang = langEl.value;
    } else {
      const obj = { id, name, icon:'custom', type, children:[] };
      if(type==='lang'){ obj.lang = langEl?langEl.value:'en'; obj.children = [{id:uuid(),name:'单词复习'},{id:uuid(),name:'听写'},{id:uuid(),name:'作文'},{id:uuid(),name:'口语'}]; }
      if(type==='sport'){ obj.children = [{id:uuid(),name:'跑步'},{id:uuid(),name:'健身'}]; }
      if(type==='parenting'){ obj.children = [{id:uuid(),name:'睡前故事'},{id:uuid(),name:'育儿锦囊'}]; }
      Store.cfg.categories.push(obj);
    }
    Store.save();
    this.closeModal();
    this.renderSidebar();
    if(!isEdit) this.selectCat(Store.cfg.categories[Store.cfg.categories.length-1]);
    toast('已保存');
  },

  delCat(id){
    if(!confirm('删除该分类及其所有历史数据？')) return;
    Store.cfg.categories = Store.cfg.categories.filter(c=>c.id!==id);
    Store.save();
    this.closeModal();
    this.renderSidebar();
    this.selectCat(Store.cfg.categories[0]||null);
    toast('已删除');
  },

  /* ---- 子项弹窗 ---- */
  openSubModal(cat, child){
    this.showModal(`
      <div class="modal-head"><h3>编辑子项</h3><button class="icon-btn" onclick="App.closeModal()">${ico('x',20)}</button></div>
      <div class="modal-body">
        <div class="field"><label>子项名称</label><input id="smName" value="${this.esc(child.name)}" placeholder="如：听力"></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-danger" onclick="App.delSub('${cat.id}','${child.id}')">删除</button>
        <button class="btn btn-ghost" onclick="App.closeModal()">取消</button>
        <button class="btn btn-primary" onclick="App.saveSub('${cat.id}','${child.id}')">保存</button>
      </div>
    `);
  },

  saveSub(catId, childId){
    const name = $('#smName').value.trim();
    if(!name){ toast('请输入名称'); return; }
    const cat = Store.cfg.categories.find(c=>c.id===catId);
    const ch = cat.children.find(c=>c.id===childId);
    ch.name = name;
    Store.save();
    this.closeModal();
    this.renderSidebar();
    this.renderMain();
    toast('已保存');
  },

  delSub(catId, childId){
    const cat = Store.cfg.categories.find(c=>c.id===catId);
    cat.children = cat.children.filter(c=>c.id!==childId);
    Store.save();
    this.closeModal();
    this.renderSidebar();
    this.renderMain();
    toast('已删除');
  },

  /* ---- 设置 ---- */
  openSettings(){
    const s = Store.cfg.settings;
    this.showModal(`
      <div class="modal-head"><h3>设置</h3><button class="icon-btn" onclick="App.closeModal()">${ico('x',20)}</button></div>
      <div class="modal-body">
        <div class="section-title" style="margin-bottom:10px">${ico('cloud',14)}<span>云端同步（Supabase）</span><span class="line"></span></div>
        <div class="field"><label>Supabase Project URL</label><input id="sbUrl" value="${this.esc(s.supabaseUrl||'')}" placeholder="https://xxx.supabase.co"></div>
        <div class="field"><label>anon public key</label><input id="sbKey" value="${this.esc(s.supabaseKey||'')}" placeholder="eyJ..."></div>
        <div class="hint" style="margin-bottom:14px">填入凭证后点击"测试连接"即可启用云端同步；留空则使用本地模式。</div>
        <div class="section-title" style="margin-bottom:10px">${ico('download',14)}<span>数据管理</span><span class="line"></span></div>
        <div class="row">
          <button class="btn btn-ghost" onclick="App.exportData()">${ico('download',16)} 导出</button>
          <button class="btn btn-ghost" onclick="App.importData()">${ico('upload',16)} 导入</button>
        </div>
        <div style="margin-top:10px"><button class="btn btn-danger" onclick="App.clearData()">清空所有数据</button></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="App.testCloud()">${s.cloudConnected?'已连接 · 断开':'测试连接'}</button>
        <button class="btn btn-primary" onclick="App.saveSettings()">保存</button>
      </div>
    `);
  },

  async testCloud(){
    const url = $('#sbUrl').value.trim();
    const key = $('#sbKey').value.trim();
    if(Store.cfg.settings.cloudConnected){
      Store.cfg.settings.cloudConnected = false;
      Store.save(); this.updateStatus(); this.closeModal(); this.openSettings();
      toast('已切换为本地模式'); return;
    }
    if(!url || !key){ toast('请填写 URL 和 key'); return; }
    toast('正在测试连接...');
    try{
      const r = await fetch(`${url}/rest/v1/`, { headers:{apikey:key, Authorization:`Bearer ${key}`} });
      if(r.ok || r.status===400 || r.status===404){
        Store.cfg.settings.cloudConnected = true;
        Store.cfg.settings.supabaseUrl = url;
        Store.cfg.settings.supabaseKey = key;
        Store.save(); this.updateStatus(); this.closeModal(); this.openSettings();
        toast('云端连接成功');
      } else { toast('连接失败：HTTP '+r.status); }
    }catch(e){ toast('连接失败：'+e.message); }
  },

  saveSettings(){
    Store.cfg.settings.supabaseUrl = $('#sbUrl').value.trim();
    Store.cfg.settings.supabaseKey = $('#sbKey').value.trim();
    Store.save();
    this.closeModal();
    toast('设置已保存');
  },

  async exportData(){
    const tasks = await DB.allTasks();
    const daily = await DB.allDaily();
    const data = { config:Store.cfg, tasks, daily, exportedAt:new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `workbuddy-backup-${todayStr()}.json`;
    a.click();
    toast('已导出');
  },

  importData(){
    const inp = document.createElement('input');
    inp.type='file'; inp.accept='.json';
    inp.onchange = async ()=>{
      const f = inp.files[0]; if(!f) return;
      const text = await f.text();
      try{
        const data = JSON.parse(text);
        if(data.config){ Store.cfg = data.config; Store.save(); }
        if(data.tasks){ for(const t of data.tasks){ await DB.putTask(t); } }
        if(data.daily){ for(const d of data.daily){ await DB.putDaily(d); } }
        this.closeModal(); this.renderSidebar(); this.renderMain();
        toast('导入成功');
      }catch(e){ toast('导入失败：'+e.message); }
    };
    inp.click();
  },

  async clearData(){
    if(!confirm('确认清空所有任务和配置？此操作不可恢复！')) return;
    localStorage.removeItem('wb_config');
    indexedDB.deleteDatabase('workbench_db');
    setTimeout(()=>location.reload(), 300);
  },

  /* ---- 弹窗工具 ---- */
  showModal(html){
    $('#modalMask').innerHTML = `<div class="modal">${html}</div>`;
    $('#modalMask').classList.add('show');
  },
  closeModal(){ $('#modalMask').classList.remove('show'); },

  esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
};

// 启动
window.addEventListener('DOMContentLoaded', ()=>App.init());
// 点击遮罩关闭弹窗
document.addEventListener('click', (e)=>{ if(e.target.id==='modalMask') App.closeModal(); });
</script>
</body>
</html>
